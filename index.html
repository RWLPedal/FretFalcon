<!DOCTYPE html>
<html lang="en" data-theme="warm">

<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: on a notched phone the page reaches every edge, and the
       tabbed layout pads itself by the safe-area insets (style/mobile.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FretFalcon — Fretboard, Chord &amp; Scale Reference with Practice Timer</title>
  <meta name="description"
    content="Free interactive fretboard, chord, scale and triad reference with a built-in practice timer, metronome and backing track. Guitar, bass, ukulele, mandolin and custom tunings. Left-handed supported.">
  <link rel="canonical" href="https://fretfalcon.com/">

  <!-- Open Graph / Facebook / Discord / Slack -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FretFalcon">
  <meta property="og:url" content="https://fretfalcon.com/">
  <meta property="og:title" content="FretFalcon — Fretboard, Chord &amp; Scale Reference with Practice Timer">
  <meta property="og:description"
    content="Free interactive fretboard, chord, scale and triad reference with a built-in practice timer, metronome and backing track. Every tool on one page.">
  <meta property="og:image" content="https://fretfalcon.com/images/screenshot-main.png">
  <meta property="og:image:width" content="1426">
  <meta property="og:image:height" content="776">
  <meta property="og:image:alt" content="The FretFalcon workspace showing a scale fretboard, chord diagrams and a chord progression.">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FretFalcon — Fretboard, Chord &amp; Scale Reference with Practice Timer">
  <meta name="twitter:description"
    content="Free interactive fretboard, chord, scale and triad reference with a built-in practice timer, metronome and backing track. Every tool on one page.">
  <meta name="twitter:image" content="https://fretfalcon.com/images/screenshot-main.png">
  <meta name="twitter:image:alt" content="The FretFalcon workspace showing a scale fretboard, chord diagrams and a chord progression.">

  <!-- Browser chrome, and the status bar of the installed app. The default "warm"
       theme's --bg until the script runs; ThemeManager then keeps it on the live theme. -->
  <meta name="theme-color" content="#efe7d3">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Add to Home Screen: name, icons and a window of its own. The hosted build points
       the two links at content-hashed files; the single-file build drops them, since a
       file opened from disk cannot be installed (build/assemble.js). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FretFalcon">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=Fredoka:wght@400;500;600&family=Hanken+Grotesk:wght@600&family=Spline+Sans+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="./js/reference_bundle.js" defer></script>
  <link rel="stylesheet" href="style/theme-tokens.css">
  <link rel="stylesheet" href="style/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "FretFalcon",
    "url": "https://fretfalcon.com/",
    "applicationCategory": "MultimediaApplication",
    "applicationSubCategory": "Music Practice",
    "operatingSystem": "Any (web browser)",
    "browserRequirements": "Requires JavaScript.",
    "description": "Free interactive fretboard, chord, scale and triad reference with a built-in practice timer, metronome and backing track. Guitar, bass, ukulele, mandolin and custom tunings. Left-handed supported.",
    "screenshot": "https://fretfalcon.com/images/screenshot-main.png",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "Interactive fretboard diagrams with 30+ scales",
      "Chord diagrams and chord progressions",
      "Triads and the CAGED system",
      "Circle of Fifths",
      "Capo calculator",
      "Metronome, drone and synthesized backing tracks",
      "Timed practice schedules",
      "Left-handed and custom-tuning support"
    ]
  }
  </script>
</head>

<body>
  <h1 class="sr-only">FretFalcon — interactive fretboard, chord and scale reference with a practice timer</h1>

  <noscript>
    <p>FretFalcon is an interactive fretboard, chord, scale and triad reference with a built-in
      practice timer, metronome and backing track, for guitar, bass, ukulele, mandolin and other
      fretted instruments. It needs JavaScript enabled to run.</p>
  </noscript>

  <div class="reference-layout">
    <div id="side-bar" class="side-bar-container">
      <!-- Sidebar content will be generated here -->
    </div>
    <div id="main-content" class="main-content-container">
      <!-- Floating views will be appended here -->
    </div>
    <div id="floating-view-area"></div>
  </div>

  <div id="overlay" class="hidden"></div>

</body>
</html>
